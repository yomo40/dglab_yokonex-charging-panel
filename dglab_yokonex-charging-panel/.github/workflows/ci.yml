name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore dglab_yokonex-charging-panel.sln
      working-directory: dglab_yokonex-charging-panel

    - name: Build
      run: dotnet build dglab_yokonex-charging-panel.sln -c Release --no-restore
      working-directory: dglab_yokonex-charging-panel

    - name: Test
      run: dotnet test dglab_yokonex-charging-panel.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"
      working-directory: dglab_yokonex-charging-panel

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: dglab_yokonex-charging-panel/**/TestResults/*.trx
